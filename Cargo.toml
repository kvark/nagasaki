[workspace]
members = ["examples/sprites"]

[package]
name = "nagasaki"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Native Rust to Naga transpiler"
license = "MIT"
repository = "https://github.com/kvark/nagasaki"
readme = "README.md"

[dev-dependencies]
# Parses the original WGSL in tests/blade_shaders.rs, so a port can be checked
# against the shader it came from rather than against its author's memory.
naga = { version = "30", features = ["wgsl-in", "wgsl-out"] }

[dependencies]
naga = { version = "30", features = ["wgsl-out"] }
# `span-locations` is what lets an error say which line it is about. Features
# are additive, so this also turns it on for the copy `syn` pulls in.
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "parsing"] }
thiserror = "2"
