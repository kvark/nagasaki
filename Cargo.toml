[package]
name = "nagasaki"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Native Rust to Naga transpiler"
license = "MIT"
repository = "https://github.com/kvark/nagasaki"
readme = "README.md"

[dev-dependencies]
# Parses the original WGSL in tests/blade_shaders.rs, so a port can be checked
# against the shader it came from rather than against its author's memory.
naga = { version = "30", features = ["wgsl-in", "wgsl-out"] }

[dependencies]
naga = { version = "30", features = ["wgsl-out"] }
syn = { version = "2", features = ["full", "parsing"] }
thiserror = "2"
